<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400" viewBox="0 0 200 400">
  <!-- PRUEBA del pipeline: figura articulada en 3 piezas con IDs estables. No es arte final. -->
  <defs>
    <pattern id="trama" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.5"/>
    </pattern>
  </defs>
  <g id="torso" data-pieza="" data-pivote="100 250">
    <rect x="65" y="130" width="70" height="130" rx="10" fill="url(#trama)" stroke="#000" stroke-width="5"/>
    <rect x="70" y="260" width="22" height="120" fill="#000"/>
    <rect x="108" y="260" width="22" height="120" fill="#000"/>
  </g>
  <g id="cabeza" data-pieza="" data-pivote="100 120">
    <circle cx="100" cy="80" r="40" fill="#fff" stroke="#000" stroke-width="5"/>
    <circle cx="115" cy="75" r="4" fill="#000"/>
  </g>
  <g id="brazo" data-pieza="" data-pivote="100 145">
    <rect x="90" y="135" width="20" height="110" rx="10" fill="#fff" stroke="#000" stroke-width="5"/>
  </g>
</svg>
