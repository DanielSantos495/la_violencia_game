<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="110" viewBox="0 0 1024 110">
  <!--
    Puente Alto · suelo de la plaza (mosaico, capa lejos)
    Capa: lejos (paralaje 0.15, 30 px/m). La base del viewBox es el suelo de la capa
    salvo que el módulo se coloque por arriba (cielo, mosaicos de suelo).
    Se coloca arriba, en el suelo de la capa (y=628), y se repite cada 1024 px.
    Colores: paleta del juego (game/art/paleta.json, planeacion/arte/tomo1/paleta.md): lavados bajo la
    línea (grafito), rojo y azul enteros.
    GENERADO por game/art/gen/puente_alto.py: edita el script, no este archivo.
  -->
  <defs>
    <pattern id="rayado" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#544f49" stroke-width="1.2"/></pattern>
  </defs>
<g data-p="plaza empedrada o de tierra: confirmar con fotos del norte de Boyacá años 40">
<rect x="0" y="0" width="1024" height="110" fill="#c6b49e"/>
<path d="" stroke="#544f49" stroke-width="0.4"/>
</g>
</svg>
