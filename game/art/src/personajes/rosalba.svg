    <!-- cuello de la ruana: rollo grueso -->
    <path d="M136,124 C146,131 159,133 168,128" stroke="#000" stroke-width="4.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== Trenza [P]: el peinado no está en el doc 03 §3.1; confirmar con fotos de época ===== -->
