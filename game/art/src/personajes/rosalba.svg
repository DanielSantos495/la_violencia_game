    <!-- luz que viene de adelante: franja con trama más abierta -->
    <path d="M162,142 C172,175 180,235 184,296 C176,299 168,300 160,299 C160,240 158,190 152,152 Z" fill="#fff"/>
    <path d="M162,142 C172,175 180,235 184,296 C176,299 168,300 160,299 C160,240 158,190 152,152 Z" fill="url(#trama-lana)"/>
    <!-- espalda en sombra plena -->
    <path d="M119,140 C108,172 100,232 96,290 C101,293 105,295 109,296 C110,240 114,182 123,144 Z" fill="#000"/>
